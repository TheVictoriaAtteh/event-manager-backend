services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_manager
      POSTGRES_USER: event_manager
      POSTGRES_PASSWORD: event_manager_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_manager -d event_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    command: ["npm", "run", "prisma:migrate:deploy"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://event_manager:event_manager_dev@db:5432/event_manager?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://event_manager:event_manager_dev@db:5432/event_manager?schema=public
      PORT: 4000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
